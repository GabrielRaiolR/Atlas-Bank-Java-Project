spring:
  datasource:
    # Compose publica Postgres em localhost:5433 para não disputar com postgres.exe na 5432 (Windows).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/atlasbank}
    username: ${DB_USER:atlas}
    password: ${DB_PASSWORD:atlas}

logging:
  level:
    com.atlasbank: DEBUG
    org.hibernate.SQL: INFO

atlas:
  jwt:
    secret: changeit-32chars-minimum-changeit-32
